name: Deploy a branch to HF test Space

on:
  workflow_dispatch:
    inputs:
      ref:
        # Leave EMPTY to deploy the branch picked in the "Use workflow from"
        # dropdown — that dropdown only selects which branch this workflow FILE is
        # read from, it is not what gets checked out, so a stale default here
        # silently deployed the wrong ref. Fill it in only to deploy a tag or SHA.
        description: 'Tag or SHA to deploy (leave empty to use the branch selected above)'
        required: false
      space:
        description: 'Target Space'
        type: choice
        options:
          - pollen-robotics/grabette-slam-test
          - CarolinePascal/grabette-slam
        default: pollen-robotics/grabette-slam-test

env:
  SPACE: ${{ inputs.space }}
  # Each Space owner needs its own write token: the pollen-robotics one cannot push elsewhere.
  TOKEN_SECRET: ${{ inputs.space == 'CarolinePascal/grabette-slam' && 'HF_TOKEN_CAROLINE' || 'HF_TOKEN' }}

concurrency:
  group: hf-space-${{ inputs.space }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref_name }}
          fetch-depth: 0
          lfs: true

      - name: Push to HF Space
        env:
          HF_TOKEN: ${{ secrets[env.TOKEN_SECRET] }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::$TOKEN_SECRET secret is not set in repo Settings → Secrets and variables → Actions"
            exit 1
          fi

          URL="https://${SPACE%%/*}:${HF_TOKEN}@huggingface.co/spaces/${SPACE}"

          # Always --force: this Space is a scratch target, whatever ref was
          # deployed last is meant to be replaced.
          git push --force "$URL" HEAD:main

      # Which branch is on the test Space, answered on the Space's own page: the
      # ref is written as a Space VARIABLE, which HF injects into the container as
      # an env var the app reads (GRABETTE_DEPLOYED_REF in app.py). No stamp file
      # is committed, so the deployed tree stays byte-identical to the branch and
      # the Dockerfile needs no COPY for a file that only exists here.
      # AFTER the push: a deploy that failed must not advertise itself as live.
      # Writing a variable restarts the Space, which the push has queued anyway.
      - name: Stamp the deployed ref on the Space
        env:
          HF_TOKEN: ${{ secrets[env.TOKEN_SECRET] }}
          REF: ${{ inputs.ref || github.ref_name }}
        run: |
          python3 -m pip install --quiet "huggingface_hub>=0.25"
          python3 - <<'PY'
          import os
          import subprocess

          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          sha = subprocess.check_output(
              ["git", "rev-parse", "--short", "HEAD"], text=True).strip()
          for key, value in (("GRABETTE_DEPLOYED_REF", os.environ["REF"]),
                             ("GRABETTE_DEPLOYED_SHA", sha)):
              api.add_space_variable(
                  repo_id=os.environ["SPACE"], key=key, value=value,
                  description="Set by the deploy-branch workflow — shown in the app's TEST banner.",
              )
              print(f"{key}={value}")
          PY

      - name: Summary
        env:
          REF: ${{ inputs.ref || github.ref_name }}
        run: |
          {
            echo "### Deployed to HF test Space"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Ref | \`$REF\` |"
            echo "| Commit | \`$(git rev-parse --short HEAD)\` |"
            echo "| Space | [$SPACE](https://huggingface.co/spaces/$SPACE) |"
            echo ""
            echo "The Space's TEST banner now names this ref (stamped as the Space"
            echo "variables \`GRABETTE_DEPLOYED_REF\` / \`GRABETTE_DEPLOYED_SHA\`)."
          } >> "$GITHUB_STEP_SUMMARY"
