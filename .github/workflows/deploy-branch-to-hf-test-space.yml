name: Deploy a branch to HF test Space

on:
  workflow_dispatch:
    inputs:
      ref:
        # Leave EMPTY to deploy the branch picked in the "Use workflow from"
        # dropdown — that dropdown only selects which branch this workflow FILE is
        # read from, it is not what gets checked out, so a stale default here
        # silently deployed the wrong ref. Fill it in only to deploy a tag or SHA.
        description: 'Tag or SHA to deploy (leave empty to use the branch selected above)'
        required: false

env:
  SPACE: pollen-robotics/grabette-slam-test

concurrency:
  group: hf-space-test
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref_name }}
          fetch-depth: 0
          lfs: true

      - name: Push to HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::HF_TOKEN secret is not set in repo Settings → Secrets and variables → Actions"
            exit 1
          fi

          URL="https://pollen-robotics:${HF_TOKEN}@huggingface.co/spaces/${SPACE}"

          # Always --force: this Space is a scratch target, whatever ref was
          # deployed last is meant to be replaced.
          git push --force "$URL" HEAD:main

      # Which branch is on the test Space, answered on the Space's own page: the
      # ref is written as a Space VARIABLE, which HF injects into the container as
      # an env var the app reads (GRABETTE_DEPLOYED_REF in app.py). No stamp file
      # is committed, so the deployed tree stays byte-identical to the branch and
      # the Dockerfile needs no COPY for a file that only exists here.
      # AFTER the push: a deploy that failed must not advertise itself as live.
      # Writing a variable restarts the Space, which the push has queued anyway.
      - name: Stamp the deployed ref on the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          REF: ${{ inputs.ref || github.ref_name }}
        run: |
          python3 -m pip install --quiet "huggingface_hub>=0.25"
          python3 - <<'PY'
          import os
          import subprocess

          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          sha = subprocess.check_output(
              ["git", "rev-parse", "--short", "HEAD"], text=True).strip()
          for key, value in (("GRABETTE_DEPLOYED_REF", os.environ["REF"]),
                             ("GRABETTE_DEPLOYED_SHA", sha)):
              api.add_space_variable(
                  repo_id=os.environ["SPACE"], key=key, value=value,
                  description="Set by the deploy-branch workflow — shown in the app's TEST banner.",
              )
              print(f"{key}={value}")
          PY

      # The card shown in the org's Spaces grid is built from the README front
      # matter — and prod and test deploy from the SAME tree, so out of the box
      # both carry the same title, emoji and gradient and cannot be told apart.
      # Override those fields on the Space only; the repo's README stays correct
      # for prod. Re-applied on every deploy, because the --force push above
      # discards the previous branding commit.
      - name: Brand the test Space card
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python3 -m pip install --quiet "huggingface_hub>=0.25"
          python3 - <<'PY'
          import os

          from huggingface_hub import HfApi

          OVERRIDES = {
              "title": "Grabette Slam (TEST)",
              "emoji": "🧪",
              "colorFrom": "gray",
              "colorTo": "red",
              "short_description": "Dev deployment — use pollen-robotics/grabette-slam",
          }

          _, front, body = open("README.md", encoding="utf-8").read().split("---", 2)

          # Replace the keys we own; keep every other line verbatim (list items
          # included, hence the leading-whitespace guard); append the ones the
          # repo does not set.
          kept, seen = [], set()
          for line in front.strip("\n").splitlines():
              key = line.split(":", 1)[0]
              if not line[:1].isspace() and key in OVERRIDES:
                  kept.append(f"{key}: {OVERRIDES[key]}")
                  seen.add(key)
              else:
                  kept.append(line)
          kept += [f"{k}: {v}" for k, v in OVERRIDES.items() if k not in seen]

          HfApi(token=os.environ["HF_TOKEN"]).upload_file(
              path_or_fileobj=("---\n" + "\n".join(kept) + "\n---" + body).encode(),
              path_in_repo="README.md",
              repo_id=os.environ["SPACE"],
              repo_type="space",
              commit_message="Brand the Space card as the TEST deployment",
          )
          print("card branded:", OVERRIDES["title"])
          PY

      - name: Summary
        env:
          REF: ${{ inputs.ref || github.ref_name }}
        run: |
          {
            echo "### Deployed to HF test Space"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Ref | \`$REF\` |"
            echo "| Commit | \`$(git rev-parse --short HEAD)\` |"
            echo "| Space | [$SPACE](https://huggingface.co/spaces/$SPACE) |"
            echo ""
            echo "The Space's TEST banner now names this ref (stamped as the Space"
            echo "variables \`GRABETTE_DEPLOYED_REF\` / \`GRABETTE_DEPLOYED_SHA\`)."
          } >> "$GITHUB_STEP_SUMMARY"
