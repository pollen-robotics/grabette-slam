name: Sync feat/tactile-sensing to HF tactile Space

on:
  push:
    branches: [feat/tactile-sensing]
  workflow_dispatch:

env:
  SPACE: pollen-robotics/grabette-slam-tactile

concurrency:
  group: hf-space-tactile
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          ref: feat/tactile-sensing
          fetch-depth: 0
          lfs: true

      - name: Ensure Space exists
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::HF_TOKEN secret is not set in repo Settings → Secrets and variables → Actions"
            exit 1
          fi
          pip install --quiet huggingface_hub
          python - <<'PY'
          import os
          from huggingface_hub import create_repo
          create_repo(
              os.environ["SPACE"],
              repo_type="space",
              space_sdk="docker",
              exist_ok=True,
              token=os.environ["HF_TOKEN"],
          )
          PY

      - name: Push to HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          URL="https://pollen-robotics:${HF_TOKEN}@huggingface.co/spaces/${SPACE}"
          # Dedicated branch-tracking Space: always mirror the branch tip.
          git push --force "$URL" HEAD:main

      - name: Summary
        run: |
          {
            echo "### Synced feat/tactile-sensing to HF Space"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`$(git rev-parse --short HEAD)\` |"
            echo "| Space | [$SPACE](https://huggingface.co/spaces/$SPACE) |"
          } >> "$GITHUB_STEP_SUMMARY"
