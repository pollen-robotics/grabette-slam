[project]
name = "grabette-postprocess"
version = "0.1.0"
description = "Post-processing for GRABETTE: SLAM orchestration and LeRobot dataset generation"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "scipy",
    # contrib (not plain opencv-python): aruco_cube needs cv2.aruco, contrib-only.
    # It is a strict superset of opencv-python, so convert.py / oak_slam.py are
    # unaffected. NOTE: lerobot pulls opencv-python transitively; the two share the
    # cv2/ install dir and can clobber — if cv2.aruco goes missing in a built env,
    # add a uv override pinning both names to the contrib build.
    "opencv-contrib-python",
    "av",
    "click",
    "pandas",
    "tqdm",
    "lerobot[dataset]>=0.6.1,<0.7.0",
]

[project.optional-dependencies]
viz = [
    "rerun-sdk>=0.24.0,<0.34.0",
]
test = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
