[project]
name = "grabette-postprocess"
version = "0.1.0"
description = "Post-processing for GRABETTE: SLAM orchestration and LeRobot dataset generation"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    # contrib (not plain opencv-python): aruco_cube needs cv2.aruco, contrib-only.
    # It is a strict superset of opencv-python, so convert.py / oak_slam.py are
    # unaffected. NOTE: lerobot pulls opencv-python transitively; the two share the
    # cv2/ install dir and can clobber — if cv2.aruco goes missing in a built env,
    # add a uv override pinning both names to the contrib build.
    "opencv-contrib-python",
    "av",
    "click",
    "pandas",
    "tqdm",
    # Pinned: the build path relies on LeRobotDataset.create(vcodec=, streaming_encoding=)
    # and on `datasets` being a core dep — both true in 0.5.1. A later release moved
    # `datasets` to an extra and dropped the `vcodec` kwarg, so an unpinned rebuild
    # broke the pipeline. Bump deliberately after checking dataset.py against the API.
    "lerobot==0.5.1 ; python_version >= '3.12'",
]

[project.optional-dependencies]
test = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
